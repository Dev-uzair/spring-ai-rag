<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring AI RAG</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    input[type=text] { width: 100%; padding: .6rem; box-sizing: border-box; margin: .4rem 0; }
    button { padding: .5rem 1rem; cursor: pointer; }
    #answer { white-space: pre-wrap; margin-top: .8rem; background: #f6f6f6; padding: .8rem; border-radius: 6px; min-height: 2rem; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Spring AI RAG demo</h1>

  <section>
    <h3>1. Upload a document</h3>
    <input type="file" id="file">
    <button onclick="upload()">Upload</button>
    <div><small id="uploadStatus"></small></div>
  </section>

  <section>
    <h3>2. Ask a question</h3>
    <input type="text" id="docId" placeholder="Document ID (optional, filled after upload)">
    <input type="text" id="question" placeholder="Ask something about your documents..." onkeydown="if(event.key==='Enter')ask()">
    <button onclick="ask()">Ask</button>
    <div id="answer"></div>
  </section>

  <script>
    async function upload() {
      const f = document.getElementById('file').files[0];
      if (!f) return;
      const fd = new FormData();
      fd.append('file', f);
      const status = document.getElementById('uploadStatus');
      status.textContent = 'Uploading and embedding...';
      const res = await fetch('/api/documents', { method: 'POST', body: fd });
      if (!res.ok) { status.textContent = 'Upload failed: ' + res.status; return; }
      const data = await res.json();
      document.getElementById('docId').value = data.documentId;
      status.textContent = `Stored ${data.chunks} chunks from ${data.filename}`;
    }

    async function ask() {
      const out = document.getElementById('answer');
      out.textContent = 'Thinking...';
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: document.getElementById('question').value,
          documentId: document.getElementById('docId').value || null
        })
      });
      out.textContent = res.ok ? (await res.json()).answer : 'Error: ' + res.status;
    }
  </script>
</body>
</html>
