server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:changeme}
      base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com}
      chat:
        completions-path: ${CHAT_COMPLETIONS_PATH:/v1beta/openai/chat/completions}
        options:
          model: ${CHAT_MODEL:gemini-flash-latest}
          temperature: 0.2
      embedding:
        embeddings-path: ${EMBEDDINGS_PATH:/v1beta/openai/embeddings}
        options:
          model: ${EMBEDDING_MODEL:gemini-embedding-001}
          dimensions: ${EMBEDDING_DIMENSIONS:768}

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:768}
app:
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
